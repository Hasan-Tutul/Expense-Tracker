<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>বছরের রিপোর্ট</title>
</head>
<body>
<main>
<header>
  <h1>বছরের রিপোর্ট</h1>
  <div class="month"><button id="prev" aria-label="আগের বছর">‹</button><b id="ylabel" style="min-width:60px"></b><button id="next" aria-label="পরের বছর">›</button></div>
</header>
<div class="stats">
  <div class="stat big"><small>এই বছরের মোট খরচ</small><b id="total">৳০</b></div>
  <div class="stat"><small>মাসে গড় খরচ</small><b id="avg">৳০</b></div>
  <div class="stat"><small>সবচেয়ে বেশি খরচের মাস</small><b id="peak">-</b></div>
</div>
<div class="stat" style="margin-top:10px"><small>না করলেও চলত এমন খরচ (এই বছরে)</small><b id="skt" style="color:var(--red)">৳০</b><small id="skp"></small></div>
<section><h2>মাস অনুযায়ী খরচ</h2><div class="chart" id="chart"></div><p class="note">লাল বারটি সবচেয়ে বেশি খরচের মাস। মাসিক খরচও এতে ধরা আছে।</p></section>
<section><h2>বছরে কোন খাতে কত গেছে</h2><div id="cats"></div></section>
<section>
  <h2>তারিখ অনুযায়ী বিস্তারিত খরচ</h2>
  <div class="tools" style="margin-bottom:10px">
    <button type="button" data-p="m">এই মাস</button><button type="button" data-p="l">গত মাস</button><button type="button" data-p="y">এই বছর</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div><label for="from">শুরুর তারিখ</label><input id="from" type="date"></div>
    <div><label for="to">শেষ তারিখ</label><input id="to" type="date"></div>
  </div>
  <button class="add" id="show" type="button" style="width:100%;margin-top:10px">বিস্তারিত দেখুন</button>
  <div id="det" style="margin-top:14px"></div>
</section>
</main>
<script src="store.js"></script>
<script>
const T=Store,$=T.$,money=T.money,esc=T.esc;
const SH=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
let year=new Date().getFullYear();
function render(){
  $('ylabel').textContent=year.toLocaleString('bn-BD',{useGrouping:false});
  const isSkip=e=>e.rec?!!(T.S.recurring.find(r=>r.id===e.rid)||{}).skip:!!e.skip;
  let sk=0;const m=Array(12).fill(0),by={};
  for(let i=0;i<12;i++)T.monthItems(year+'-'+T.p2(i+1)).forEach(e=>{m[i]+=e.amt;if(isSkip(e))sk+=e.amt;by[e.cat||'খাত ঠিক নেই']=(by[e.cat||'খাত ঠিক নেই']||0)+e.amt});
  const total=m.reduce((a,b)=>a+b,0),active=m.filter(v=>v>0).length,max=Math.max(...m);
  $('total').textContent=money(total);
  $('skt').textContent=money(sk);$('skp').textContent=total?'মোট খরচের '+T.bn(sk/total*100)+'% টাকা না খরচ করলেও চলত':'';
  $('avg').textContent=active?money(total/active):'৳০';
  $('peak').textContent=max>0?T.MONTHS[m.indexOf(max)]:'-';
  $('chart').innerHTML=m.map((v,i)=>`<div class="col${v===max&&v>0?' top':''}" title="${T.MONTHS[i]}: ${money(v)}"><i style="height:${max?v/max*85:0}%"></i><span>${SH[i]}</span></div>`).join('');
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('cats').innerHTML=rows.length?rows.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="t"><i style="width:${v/total*100}%"></i></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">এই বছরে কোনো খরচ যোগ করা হয়নি</div>';
}
$('prev').onclick=()=>{year--;render()};
$('next').onclick=()=>{year++;render()};

const isSk=e=>e.rec?!!(T.S.recurring.find(r=>r.id===e.rid)||{}).skip:!!e.skip;
const fmtD=d=>d.getFullYear()+'-'+T.p2(d.getMonth()+1)+'-'+T.p2(d.getDate());
function preset(p){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  const r={m:[new Date(y,m,1),new Date(y,m+1,0)],l:[new Date(y,m-1,1),new Date(y,m,0)],y:[new Date(y,0,1),new Date(y,11,31)]}[p];
  $('from').value=fmtD(r[0]);$('to').value=fmtD(r[1]);
}
document.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{preset(b.dataset.p);details()});
function details(){
  const f=$('from').value,t=$('to').value;
  if(!f||!t){T.toast('শুরু ও শেষ দুটো তারিখই দিন');return}
  if(f>t){T.toast('শুরুর তারিখ শেষ তারিখের আগে হতে হবে');return}
  const items=[];
  let y=+f.slice(0,4),m=+f.slice(5,7);
  const ey=+t.slice(0,4),em=+t.slice(5,7);
  while(y<ey||(y===ey&&m<=em)){
    T.monthItems(y+'-'+T.p2(m)).forEach(e=>{if(e.date>=f&&e.date<=t)items.push(e)});
    if(++m>12){m=1;y++}
  }
  items.sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  if(!items.length){$('det').innerHTML='<div class="empty">এই সময়ে কোনো খরচ পাওয়া যায়নি</div>';return}
  const tot=items.reduce((s,e)=>s+e.amt,0),sk=items.filter(isSk).reduce((s,e)=>s+e.amt,0);
  const NC='খাত ঠিক নেই';
  $('det').innerHTML=`<div class="stats"><div class="stat"><small>মোট খরচ</small><b>${money(tot)}</b></div><div class="stat"><small>খরচের সংখ্যা</small><b>${T.bn(items.length)}টি</b></div></div>`+
    (sk?`<p class="note">এর মধ্যে ${money(sk)} না করলেও চলত।</p>`:'')+
    '<div style="margin-top:8px">'+items.map(e=>{
      const d=new Date(e.date+'T00:00:00');
      const note=e.who?e.who+'-কে দেওয়া'+(e.note?' · '+e.note:''):e.note;
      return `<div class="item"><div><div class="n">${esc(e.cat||NC)}${note?' · '+esc(note):''}${e.rec?'<span class="tag">মাসিক</span>':''}${isSk(e)?'<span class="tag" style="background:#ffe3a3;color:#6b4a00">না করলেও চলত</span>':''}</div><div class="m">${d.getDate().toLocaleString('bn-BD')} ${T.MONTHS[d.getMonth()]} ${d.getFullYear().toLocaleString('bn-BD',{useGrouping:false})}</div></div><div class="a">${money(e.amt)}</div></div>`;
    }).join('')+'</div>';
}
$('show').onclick=details;
preset('m');
T.start(render);
</script>
</body>
</html>
