<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>আমার খরচের খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12201b;--mute:#5d6f68;--line:#d9e3df;--g:#0b5d46;--g2:#d8eee6;--red:#d9402a;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0d1714;--card:#15231f;--ink:#e6f0ec;--mute:#92a89f;--line:#26382f;--g:#4fd1a1;--g2:#173a2e;--red:#ff7a63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 14px}
h1{font-size:20px;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.month b{min-width:110px;text-align:center}
.hero{background:var(--g);color:#fff;border-radius:var(--r);padding:22px 20px}
@media(prefers-color-scheme:dark){.hero{background:var(--g2);color:var(--ink)}}
.hero small{opacity:.8;font-size:14px}
.total{font-size:clamp(40px,12vw,64px);font-weight:700;line-height:1.1;margin:2px 0 12px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .3s}
.hero.over .bar i{background:#ffb4a6}
.hero .row{display:flex;justify-content:space-between;font-size:14px;margin-top:8px;gap:8px;flex-wrap:wrap}
.hero button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
h2{font-size:16px;margin:0 0 12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.add{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){.add{color:#07201a}}
.cat{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.cat .t{height:10px;background:var(--g2);border-radius:10px;overflow:hidden}
.cat .t i{display:block;height:100%;background:var(--g);border-radius:10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .n{font-weight:500}
.item .m{font-size:13px;color:var(--mute)}
.item .a{font-weight:600;white-space:nowrap;text-align:right}
.item button{background:none;border:0;color:var(--red);cursor:pointer;font-size:13px;padding:0}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools label{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--g);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
@media(prefers-color-scheme:dark){.toast{color:#07201a}}
.toast.show{transform:translate(-50%,0);opacity:1}
.item.new{animation:flash 1.6s}
@keyframes flash{0%,60%{background:var(--g2)}100%{background:transparent}}
@media(prefers-reduced-motion:reduce){.item.new{animation:none}.toast{transition:none}}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
</style>
</head>
<body>
<main>
<header>
  <h1>আমার খরচের খাতা</h1>
  <div class="month">
    <button id="prev" aria-label="আগের মাস">‹</button>
    <b id="mlabel"></b>
    <button id="next" aria-label="পরের মাস">›</button>
  </div>
</header>

<p style="margin:0 0 12px"><a href="report.html" style="color:var(--g);font-weight:600;text-decoration:none">বছরের রিপোর্ট দেখুন ›</a></p>

<div class="hero" id="hero">
  <small>এই মাসের মোট খরচ</small>
  <div class="total" id="total">৳০</div>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <div class="row"><span id="budtxt"></span><button id="setbud">বাজেট ঠিক করুন</button></div>
</div>

<section>
  <h2>খরচ যোগ করুন</h2>
  <form id="f">
    <div><label for="amt">টাকা (৳)</label><input id="amt" type="number" min="1" step="any" inputmode="decimal" required></div>
    <div><label for="date">তারিখ</label><input id="date" type="date" required></div>
    <div><label for="cat">ক্যাটাগরি</label><select id="cat"></select></div>
    <div><label for="note">নোট</label><input id="note" type="text" maxlength="80" placeholder="যেমন: দুপুরের খাবার"></div>
    <button class="add full" type="submit">খরচ সেভ করুন</button>
  </form>
</section>

<section>
  <h2>এই মাসের খরচের তালিকা</h2>
  <div id="list"></div>
</section>

<section>
  <h2>ক্যাটাগরি অনুযায়ী</h2>
  <div id="cats"></div>
</section>

<section>
  <h2>ব্যাকআপ</h2>
  <div class="tools">
    <button id="exp">ব্যাকআপ নামান (JSON)</button>
    <button id="csv">Excel/CSV নামান</button>
    <label>ব্যাকআপ ফেরত আনুন<input id="imp" type="file" accept=".json" hidden></label>
  </div>
  <p class="note">ডেটা শুধু এই ব্রাউজারে সেভ থাকে। ব্রাউজারের ডেটা মুছলে বা অন্য ফোনে খুললে খাতা খালি দেখাবে, তাই মাঝেমধ্যে ব্যাকআপ নামিয়ে রাখুন।</p>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='hasan-expenses-v1';
const CATS=['খাবার','বাজার','যাতায়াত','বাসা ভাড়া','বিল','মোবাইল ও ইন্টারনেট','বিজনেস','স্বাস্থ্য','বিনোদন','অন্যান্য'];
const MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
let S={expenses:[],budget:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('সেভ করা যায়নি। ব্রাউজারের স্টোরেজ বন্ধ থাকতে পারে।')}};
const $=id=>document.getElementById(id);
const bn=n=>Math.round(n).toLocaleString('bn-BD');
const money=n=>'৳'+bn(n);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let cur=new Date();cur.setDate(1);

$('cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('date').value=today();

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  const key=ymd(cur);
  $('mlabel').textContent=MONTHS[cur.getMonth()]+' '+cur.getFullYear().toLocaleString('bn-BD',{useGrouping:false});
  const items=S.expenses.filter(e=>e.date.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const total=items.reduce((s,e)=>s+e.amt,0);
  $('total').textContent=money(total);
  const hero=$('hero');
  if(S.budget>0){
    const left=S.budget-total;
    $('fill').style.width=Math.min(100,total/S.budget*100)+'%';
    hero.classList.toggle('over',left<0);
    $('budtxt').textContent=left>=0?`বাজেট ${money(S.budget)}, বাকি ${money(left)}`:`বাজেটের চেয়ে ${money(-left)} বেশি`;
  }else{
    $('fill').style.width='0';hero.classList.remove('over');
    $('budtxt').textContent='মাসের বাজেট দেওয়া নেই';
  }
  const by={};items.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('cats').innerHTML=rows.length?rows.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="t"><i style="width:${v/total*100}%"></i></div><b>${money(v)}</b></div>`).join(''):'<div class="empty">এই মাসে এখনো কোনো খরচ নেই</div>';
  $('list').innerHTML=items.length?items.map(e=>{
    const d=new Date(e.date+'T00:00:00');
    return `<div class="item"><div><div class="n">${esc(e.note||e.cat)}</div><div class="m">${esc(e.cat)} · ${d.getDate().toLocaleString('bn-BD')} ${MONTHS[d.getMonth()]}</div></div><div class="a">${money(e.amt)}<br><button data-id="${e.id}">মুছুন</button></div></div>`}).join(''):'<div class="empty">উপরের ফর্ম থেকে প্রথম খরচটি যোগ করুন</div>';
}

$('f').addEventListener('submit',ev=>{
  ev.preventDefault();
  const amt=parseFloat($('amt').value);
  if(!(amt>0))return;
  S.expenses.push({id:Date.now(),amt,cat:$('cat').value,date:$('date').value,note:$('note').value.trim()});
  save();
  const d=new Date($('date').value+'T00:00:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
  $('amt').value='';$('note').value='';$('amt').focus();
  render();
  const first=$('list').querySelector('.item');
  if(first)first.classList.add('new');
  toast(money(amt)+' সেভ হয়েছে। এই মাসের মোট '+$('total').textContent);
  $('list').scrollIntoView({behavior:'smooth',block:'start'});
});
let tt;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000)}
$('list').addEventListener('click',ev=>{
  const id=ev.target.dataset&&ev.target.dataset.id;
  if(id&&confirm('এই খরচটি মুছে ফেলবেন?')){S.expenses=S.expenses.filter(e=>String(e.id)!==id);save();render()}
});
$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('setbud').onclick=()=>{
  const v=prompt('প্রতি মাসের বাজেট কত টাকা? (বন্ধ করতে ০ দিন)',S.budget||'');
  if(v===null)return;
  const n=parseFloat(v);S.budget=n>0?n:0;save();render();
};
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('exp').onclick=()=>download('expenses-backup-'+today()+'.json',JSON.stringify(S,null,2),'application/json');
$('csv').onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Date','Category','Amount','Note'],...S.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.cat,e.amt,e.note])];
  download('expenses-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
};
$('imp').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.expenses))throw 0;
      if(confirm('বর্তমান ডেটা মুছে ব্যাকআপের ডেটা বসানো হবে। চালিয়ে যাবেন?')){S={expenses:d.expenses,budget:d.budget||0};save();render()}
    }catch(e){alert('ফাইলটি ঠিক নেই। এই অ্যাপ থেকে নামানো JSON ব্যাকআপ দিন।')}
    ev.target.value='';
  };
  r.readAsText(f);
};
render();
</script>
</body>
</html>
